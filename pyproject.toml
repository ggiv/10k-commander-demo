[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "10k-commander-demo"
version = "0.1.0"
description = "Auditable annual software-business metrics from SEC disclosures (reference code)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["duckdb==1.5.6", "httpx==0.28.1", "PyYAML==6.0.3", "pytz>=2025.2,<2027"]

[project.scripts]
growth-cost = "growth_cost.cli:main"

[dependency-groups]
dev = ["mypy>=1.19,<2", "pytest>=9,<10", "ruff>=0.14,<1", "types-PyYAML>=6,<7"]

[tool.hatch.build.targets.wheel]
packages = ["src/growth_cost"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["cloud: authenticated MotherDuck integration (explicit opt-in)"]
